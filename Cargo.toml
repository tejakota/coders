[workspace]
resolver = "2"
members = [
    "crates/coders-provider",
    "crates/coders-tools",
    "crates/coders-skills",
    "crates/coders-core",
    "crates/coders-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
dirs = "5"
regex = "1"
walkdir = "2"
globset = "0.4"
